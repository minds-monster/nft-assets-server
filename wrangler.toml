name = "nft-assets-server"
main = "src/api-server.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

# Bind R2 bucket
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "nft-assets"

[vars]
IPFS_GATEWAY_URL = "https://cloudflare-ipfs.com/ipfs/"
# Secrets (Set via `wrangler secret put`)
# ALCHEMY_API_KEY = ""
# DATABASE_URL = ""
# DATABASE_KEY = ""
# X402_WALLET_ADDRESS = ""
